<title>セキュリティ職 28卒 募集レーダー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232447C9'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23fff'/%3E%3Cpath d='M16 16 24 9' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF0F4; --fg:#111827; --muted:#5F6977; --line:#E3E7ED; --line-2:#D3D9E2;
  --accent:#2447C9; --accent-soft:#E7ECFB; --accent-ink:#1D3BA8;
  --crit:#C8302A; --high:#C2621E; --med:#977405; --low:#23824C;
  --crit-soft:#FCECEA; --high-soft:#FDEEE2; --med-soft:#FBF3D4; --low-soft:#E3F4E9;
  --shadow:0 1px 1px rgba(17,24,39,.04),0 8px 24px -12px rgba(17,24,39,.12);
  --radius:14px;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1}
a{color:var(--accent-ink);text-decoration-thickness:1px;text-underline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);flex:none;display:grid;place-items:center}
.brand h1{font-size:16.5px;font-weight:700;margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.chip:focus-visible,.q:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:26px 64px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 28px;box-shadow:var(--shadow);margin-bottom:22px}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:0 0 6px}
.hero h2{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.35;margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0 24px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.hero{padding:20px}.hero h2{font-size:21px}.stats{grid-template-columns:1fr 1fr;gap:12px 20px}}
.warn{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 14px;margin:0 0 22px}
.warn b{color:var(--fg)}

.bar{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);width:34px;flex:none}
.chip{appearance:none;font:inherit;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;line-height:1.5}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q{appearance:none;font:inherit;font-size:14px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;max-width:340px}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent-ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:4px 6px}
.count{font-size:13px;color:var(--muted);margin-left:auto}

.sec+.sec{margin-top:32px}
.sec h3{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.sec h3 .c{opacity:.75;font-weight:600;letter-spacing:0}
.cards{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
@media (min-width:720px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card:hover{border-color:var(--line-2)}
.card summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.card summary::-webkit-details-marker{display:none}
.head{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.head h4{font-size:16.5px;font-weight:700;margin:0;line-height:1.4}
.head .more{font-size:12px;color:var(--muted);white-space:nowrap}
.card[open] .head .more .o{display:none} .card:not([open]) .head .more .c{display:none}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--surface);line-height:1.7}
.pill.on{border-color:transparent;background:var(--accent-soft);color:var(--accent-ink)}
.pill.k{min-width:62px;justify-content:center}
.pill.k-hon{color:var(--accent-ink)} .pill.k-int{color:var(--low)} .pill.k-early{color:var(--high)} .pill.k-ev{color:var(--muted)}
.why{font-size:13px;color:var(--muted);line-height:1.6}
.ops{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.op{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start}
.op .pill{margin-top:3px}
.op .t{font-size:14px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.op .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.6}
.op.closed{opacity:.55}
.s{font-weight:700} .s.crit{color:var(--crit)} .s.high{color:var(--high)} .s.med{color:var(--med)} .s.low{color:var(--low)}
.s.open{color:var(--low)} .s.up{color:var(--accent-ink)} .s.unk,.s.end{color:var(--muted);font-weight:600}
.inner{padding:2px 18px 18px;border-top:1px solid var(--line)}
.inner h5{font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;font-weight:700}
.inner .org{font-size:14px}
.note{margin:8px 0;font-size:13.5px}
.note b{font-weight:600}
.note .tags{color:var(--muted);font-size:12.5px;margin-left:4px}
.note .src{font-size:12px;color:var(--muted)}
.ev{display:flex;flex-direction:column;gap:3px;font-size:13px}
.ev a{overflow-wrap:anywhere}
.ext{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
a.linkbtn{text-decoration:none}
.calbtn{appearance:none;border:0;background:none;padding:0;font:inherit;font-size:inherit;color:var(--accent-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.calbtn:focus-visible,.calmenu a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.calmenu{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.calmenu[hidden]{display:none}
.calmenu a{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.calmenu a:hover{background:var(--accent-soft);border-color:transparent}
.xbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--accent-ink);text-decoration:none;line-height:1.6;white-space:nowrap}
.xbtn:hover{background:var(--accent-soft);border-color:transparent}
.xbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.lgd{position:relative;overflow:hidden;isolation:isolate}
.card.lgd summary>*:not(.lg){position:relative;z-index:1}
.card .lg{--lgc:var(--lc);position:absolute;pointer-events:none;z-index:0;top:var(--lt);right:-10px;width:min(var(--lw),46%);height:var(--lh);background:linear-gradient(215deg,var(--lgc) 18%,color-mix(in srgb,var(--lgc) 35%,transparent) 55%,transparent 88%);-webkit-mask:var(--li) no-repeat right center/contain;mask:var(--li) no-repeat right center/contain;opacity:var(--lo,.32)}
.card.lgd .head .more{background:color-mix(in srgb,var(--surface) 82%,transparent);border-radius:6px;padding:0 5px;margin-right:-5px}
.inner .foot{font-size:12px;color:var(--muted);margin-top:12px}

.empty{color:var(--muted);font-size:14px;padding:14px 16px;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius)}
.after{margin-top:40px;display:grid;gap:12px}
.after details{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px}
.after summary{cursor:pointer;font-size:14px;font-weight:600}
.after ul{margin:10px 0 4px;padding-left:18px;font-size:13px;color:var(--muted);columns:2 300px;column-gap:28px}
.after li{margin:3px 0;break-inside:avoid}
.after li b{color:var(--fg);font-weight:600}
.after .prose{font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.after .prose p{margin:0 0 8px}
footer{font-size:12px;color:var(--muted);margin-top:28px;text-align:center}
@media print{
  header.top,.bar,.linkbtn,.ext,.calbtn,.calmenu{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .card,.hero,.after details{box-shadow:none;break-inside:avoid}
  .cards{grid-template-columns:1fr 1fr}
  main{padding:0}
}
</style>

document.addEventListener("click",e=>{const b=e.target.closest(".calbtn");if(!b)return;e.preventDefault();e.stopPropagation();const m=b.nextElementSibling;const show=m.hidden;m.hidden=!show;b.setAttribute("aria-expanded",String(show));});
function card(c){const id="c-"+c.id;
  const ops=c._ops.map(o=>{const k=K[o.kind]||[o.kind,"k-ev"];return '<li class="op'+(st(o)==="closed"?" closed":"")+'"><span class="pill k '+k[1]+'">'+esc(k[0])+'</span><div><div class="t">'+esc(o.title)+'</div><div class="m">'+line(o)+(o.url?' ・ <a href="'+esc(o.url)+'" target="_blank" rel="noopener noreferrer">募集ページ</a>':"")+cal(c,o)+"</div></div></li>";}).join("");
  const notes=c.items.filter(o=>o.note||(o.roles&&o.roles.length)||o.source).map(o=>'<div class="note"><b>'+esc(o.title)+"</b>"+(o.roles&&o.roles.length?'<span class="tags">'+o.roles.map(esc).join("・")+"</span>":"")+(o.note?"<div>"+esc(o.note)+"</div>":"")+(o.source?'<div class="src">出典：'+esc(o.source)+"</div>":"")+"</div>").join("");
  const lo=c.logo,lst=lo?' style="--li:url('+esc(lo.src)+');--lw:'+(+lo.w)+'px;--lh:'+(+lo.h)+'px;--lt:'+(+lo.top)+'px;--lc:'+esc(lo.color)+';--lo:'+(+lo.opacity)+'"':"";
  return '<details class="card'+(lo?" lgd":"")+'" id="'+id+'"'+lst+(OPEN.has(id)?" open":"")+"><summary>"+(lo?'<span class="lg" aria-hidden="true"></span>':"")+
   '<div class="head"><h4>'+esc(c.name)+'</h4><span class="more"><span class="o">詳細 ▾</span><span class="c">閉じる ▴</span></span></div>'+
   '<div class="meta"><span class="pill">'+esc(G[c.group]||c.group)+"</span>"+(c.assured==="yes"?'<span class="pill on">セキュリティ配属確約</span>':c.assured==="no"?'<span class="pill">配属は入社後決定</span>':"")+"</div>"+
   (c.why?'<div class="why">'+esc(c.why)+"</div>":"")+'<ul class="ops">'+ops+"</ul>"+ext(c)+"</summary>"+
   '<div class="inner">'+(c.securityOrg?'<h5>セキュリティ組織</h5><div class="org">'+esc(c.securityOrg)+"</div>":"")+
   (notes?"<h5>募集メモ</h5>"+notes:"")+
   (c.evidence&&c.evidence.length?'<h5>根拠資料</h5><div class="ev">'+c.evidence.map(e=>'<a href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">'+esc(e.title||e.url)+"</a>").join("")+"</div>":"")+
   '<div class="foot">確認日 '+esc(c.checked||D.date)+(c.confidence?" ・ 情報の確度 "+(CONF[c.confidence]||esc(c.confidence)):"")+"</div></div></details>";}

function list(){const v=view();$("#count").textContent=v.length+"社を表示";
  if(!v.length){$("#list").innerHTML='<div class="empty">条件に合う企業がありません。</div>';syncOpenBtn();return;}
  const B=[["open","募集中"],["upcoming","公開予定"],["unknown","確認中"],["closed","今シーズンは終了"]];
  $("#list").innerHTML=B.map(([k,l])=>{const xs=v.filter(c=>c._best===k);return xs.length?'<section class="sec"><h3>'+l+' <span class="c">'+xs.length+"社</span></h3><div class=\"cards\">"+xs.map(card).join("")+"</div></section>":"";}).join("");
  syncOpenBtn();}

function head(){const all=D.items,best=c=>{const o=c.items.slice().sort(cmp)[0];return o?st(o):"none";};
  const nOpen=all.filter(c=>c.items.some(o=>st(o)==="open")).length,nUp=all.filter(c=>best(c)==="upcoming").length,nA=all.filter(c=>c.assured==="yes").length;
  $("#stats").innerHTML=[["掲載企業",all.length],["募集中",nOpen],["公開予定",nUp],["配属確約あり",nA]].map(([l,n])=>'<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+"</div></div>").join("");
  $("#sub").textContent=D.date?jdate(D.date)+"調査":"";
  const grp=(arr,f)=>{const by={};arr.forEach(x=>{(by[x.group]=by[x.group]||[]).push(x);});return Object.keys(G).filter(k=>by[k]).map(k=>"<li><b>"+G[k]+"</b>："+by[k].map(f).join("、")+"</li>").join("")+(Object.keys(by).filter(k=>!G[k]).map(k=>"<li>"+by[k].map(f).join("、")+"</li>").join(""));};
  $("#after").innerHTML=
   '<details><summary>対象と調べ方</summary><div class="prose">'+
   "<p>対象は、東証プライム上場企業、大手グループの中核会社・情報システム子会社、名の知れたセキュリティ専業、日本で新卒を採用する大手外資系です。職種はSOC・CSIRT・DFIR・検知エンジニアリング・脆弱性診断・セキュリティエンジニア・セキュリティコンサルを含みます。</p>"+
   "<p>候補は就活サイトだけでなく、各社の公式採用サイト、統合報告書のセキュリティ組織の記述、業界団体の会員一覧（ISOG-J、ICT-ISAC、金融ISAC、交通ISACなど）、セキュリティサービス市場のレポート、業界ニュースから洗い出しました。募集中の締切は出典ページを開き直して照合しています。</p>"+
   "<p>「セキュリティ配属確約」は、職種別・コース別採用などで入社時の配属先がセキュリティ領域に決まるものを指します。</p><p>カード下部のOpenWork・ONE CAREERボタンから、各サイトの企業ページ（社員クチコミ・選考体験談）を開けます。ONE CAREERに企業ページがない会社はOpenWorkのみです。カード右上のロゴは各社の公式サイトなどから取得したもので、各社の商標です。</p><p>締切・受付開始日が先にある募集には「カレンダー」ボタンがあり、Googleカレンダーか、iPhone・Outlook用の.icsファイルで予定に追加できます。.icsには締切の3日前と前日の朝に通知が入っています。</p></div></details>"+
   (D.excluded.length?"<details><summary>調べたがセキュリティ職の採用経路が見当たらなかった企業（"+D.excluded.length+"社）</summary><ul>"+grp(D.excluded,x=>esc(x.name)+(x.reason?"（"+esc(x.reason)+"）":""))+"</ul></details>":"")+
   (D.unchecked.length?"<details><summary>サイトにアクセスできず未確認の企業（"+D.unchecked.length+"社）</summary><ul>"+grp(D.unchecked,x=>esc(x.name))+"</ul></details>":"");
  $("#foot").textContent=(D.date?jdate(D.date)+"時点の情報。":"")+"各社の募集内容は予告なく変わることがあります。";}

/* print: open everything, then restore */
let pre=null;
addEventListener("beforeprint",()=>{pre=[...document.querySelectorAll("details")].map(d=>d.open);document.querySelectorAll("details").forEach(d=>d.open=true);});
addEventListener("afterprint",()=>{if(pre)document.querySelectorAll("details").forEach((d,i)=>d.open=pre[i]);pre=null;});

if(D.items.some(c=>c.items.some(calEv)))$("#calall").hidden=false;
bar();head();list();
})();
</script>
</body>
</html>
